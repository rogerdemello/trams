# ═════════════════════════════════════════════════════════════════════════════
# Trams NATS server configuration
#
# This file is where "secure inter-service communication" is actually enforced.
# TLS on its own only gives you an encrypted pipe to a broker that will then
# happily let any authenticated client publish anything it likes. The
# authorization block below is what makes the messaging layer genuinely secure:
# each service is granted the minimum set of subjects its job requires, and
# nothing else.
#
# The resulting property, which is the point of the whole exercise:
#
#   - A compromised Notification Service CANNOT forge a `user.registered`
#     event, because it has no publish permission on `user.>`.
#   - A compromised User Service CANNOT read the event stream back, because it
#     has no consumer-read permission.
#
# Neither service can do the other's job. That is a broker-enforced boundary,
# not a convention the application code is trusted to respect.
# ═════════════════════════════════════════════════════════════════════════════

server_name: trams-nats
listen: 0.0.0.0:4222

# Monitoring endpoint (http://localhost:8222/varz, /jsz). Bound to loopback:
# it exposes stream and consumer internals and must not be publicly reachable.
http: 127.0.0.1:8222

# ── JetStream ────────────────────────────────────────────────────────────────
# File-backed storage is required, not optional. The transactional outbox goes
# to great lengths to guarantee an event reaches the broker; memory storage
# would then throw that guarantee away on the next restart.
#
# The paths in this file are relative to the working directory, which is the
# repository root under `npm run nats`. docker-compose.yml mirrors that layout
# under /app so this one file serves both. Changing a path here means changing
# the corresponding mount there, or the container silently loses its store.
jetstream {
  store_dir: "./infra/nats/jetstream"
  max_memory_store: 268435456   # 256 MB
  max_file_store: 2147483648    # 2 GB
}

# ── Transport security: mutual TLS ───────────────────────────────────────────
# `verify: true` is the line that makes this *mutual* TLS. Without it the client
# authenticates the server but not the reverse, and any host that can reach the
# port may attempt to authenticate. With it, a client must present a
# certificate signed by our CA before the password is even considered.
#
# Two independent layers, deliberately:
#   1. mTLS proves "this is a legitimate Trams service" (fleet membership).
#   2. The per-user credentials below prove "this is *which* service" (role).
# Compromising one does not grant the other. Generate all of it with
# `npm run certs`.
tls {
  cert_file: "./infra/nats/certs/server-cert.pem"
  key_file:  "./infra/nats/certs/server-key.pem"
  ca_file:   "./infra/nats/certs/ca-cert.pem"
  verify:    true
  timeout:   5
}

# ── Accounts and per-service authorization ───────────────────────────────────
#
# NOTE ON PASSWORDS: the values here are development placeholders that match
# .env.example, and this file is committed, so they are not secrets. For any
# real deployment, use bcrypt hashes (`nats server passwd`) or NATS
# decentralised auth (NKEYs/JWTs) and template this file from your secret store.
# See docs/security.md.
accounts {
  TRAMS: {
    jetstream: enabled

    users: [
      # ─────────────────────────────────────────────────────────────────────
      # user-service — PRODUCER and owner of the stream topology.
      #
      # May publish domain events and manage the streams it owns. May NOT read
      # the stream: note the absence of `$JS.API.CONSUMER.MSG.NEXT.>` and
      # `$JS.ACK.>` below. That omission is the whole point — a producer has no
      # business consuming, and if this service is ever compromised the event
      # history is not readable through its credentials.
      # ─────────────────────────────────────────────────────────────────────
      {
        user: "user-service"
        password: "dev-user-service-pass-change-me"
        permissions: {
          publish: {
            allow: [
              # The domain events themselves.
              "user.>",

              # JetStream account discovery.
              "$JS.API.INFO",

              # Stream management, scoped to the two streams it owns by name.
              # A wildcard here would let this service reconfigure or delete
              # any stream in the account.
              "$JS.API.STREAM.CREATE.USER_EVENTS",
              "$JS.API.STREAM.UPDATE.USER_EVENTS",
              "$JS.API.STREAM.INFO.USER_EVENTS",
              "$JS.API.STREAM.CREATE.USER_EVENTS_DLQ",
              "$JS.API.STREAM.UPDATE.USER_EVENTS_DLQ",
              "$JS.API.STREAM.INFO.USER_EVENTS_DLQ",

              # Consumer *provisioning* only. The producer creates the
              # notification consumer so the two services have no startup
              # ordering dependency on each other, but creating a consumer is
              # not the same capability as reading from one.
              "$JS.API.CONSUMER.CREATE.USER_EVENTS.>",
              "$JS.API.CONSUMER.DURABLE.CREATE.USER_EVENTS.>",
              "$JS.API.CONSUMER.INFO.USER_EVENTS.>",
              "$JS.API.CONSUMER.UPDATE.USER_EVENTS.>"
            ]
          }
          subscribe: {
            # Request/reply inboxes only. This is how publish acknowledgements
            # come back. It grants no ability to subscribe to `user.>`.
            allow: ["_INBOX.>"]
          }
        }
      }

      # ─────────────────────────────────────────────────────────────────────
      # notification-service — CONSUMER.
      #
      # May pull from exactly one named consumer on one named stream, ack what
      # it pulls, and publish dead letters. Nothing else.
      #
      # Worth noting: there is no `subscribe` permission on `user.>` here, and
      # none is needed. With a *pull* consumer, messages arrive as replies to a
      # MSG.NEXT request on a private inbox rather than via a subscription. The
      # read capability is expressed entirely through consumer permissions,
      # which is a tighter and more auditable grant than a subject subscription.
      # ─────────────────────────────────────────────────────────────────────
      {
        user: "notification-service"
        password: "dev-notification-service-pass-change-me"
        permissions: {
          publish: {
            allow: [
              # Dead letters. This is the ONLY subject it may write to, so it
              # cannot forge a user event.
              "dlq.>",

              "$JS.API.INFO",

              # Read from its own durable consumer, named explicitly. Even the
              # stream is pinned, so it cannot pull from a different one.
              "$JS.API.CONSUMER.INFO.USER_EVENTS.notification-worker",
              "$JS.API.CONSUMER.MSG.NEXT.USER_EVENTS.notification-worker",

              # Acknowledge (ack / nak / term) messages it was delivered.
              "$JS.ACK.USER_EVENTS.>"
            ]
          }
          subscribe: {
            allow: ["_INBOX.>"]
          }
        }
      }
    ]
  }

  # The system account is kept separate from application traffic so that
  # server-level advisories and monitoring are not reachable with service
  # credentials.
  SYS: {
    users: [
      { user: "sys", password: "dev-sys-pass-change-me" }
    ]
  }
}

system_account: SYS

# ── Limits ───────────────────────────────────────────────────────────────────
max_connections: 1000
max_payload: 1MB        # our events are ~500 bytes; this is a generous ceiling
max_pending: 64MB
write_deadline: "10s"

# ── Logging ──────────────────────────────────────────────────────────────────
debug: false
trace: false
logtime: true
